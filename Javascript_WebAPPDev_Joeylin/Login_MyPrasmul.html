<!DOCTYPE html>

<html lang="en">

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        align-items: center;
        padding-left: 500px;
        padding-right: 500px;
        padding-top: 50px;
    }
    p.details {
        font-size: 13px;
        color: #666;
    }
    button {
        background-color: #000459;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 10px;
    }
    label {
        display: block;
        margin-bottom: 5px;
    }

    input.text, input[type="email"], input[type="password"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
    }
    input[placeholder="Enter your email"], input[placeholder="Enter your password"] {
        font-style: italic;
        color: #999;
    }
    input.checkbox {
        width: auto;
        margin-right: 5px;
    }
    a.forgot {
        color: #0c6dff;
        text-decoration: none;
        font-size: 12px;
        font-style: italic;
        position: absolute;
        right: 0;
    }
    div.forgot-container {
        position: relative;
        margin-bottom: 30px;
    }
    div.checkbox-container {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        margin-bottom: 25px;
    }
    img {
        width: 20px;
        height: auto;
        margin-top: 20px;
        display: flex;
    }
    p.p {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
        margin-bottom: -2px;
        display: flex;
    }
    p.account {
        font-size: 12px;
        color: #666;
        margin-top: 10px;
        text-align: center;
    }
    label.robot {
        font-size: 12px;
        color: #666;
        margin-left: 5px;
        padding: 5px;
    }
    h1 {
    
        margin-bottom: -10px;
    }


</style>
<body>
    <h1>Welcome</h1>
    <p class="details">Please enter your login credentials</p>
    <div>
        <label>Email</label>
    </div>
    <div>
        <input type="email" name="email" placeholder="Enter your email" />
    </div>
    <div>
        <label>Password</label>
    </div>
    <div>
        <input type="password" name="password" placeholder="Enter your password" />
    </div>
    <div class="forgot-container">
        <a class="forgot" href="https://www.djangoproject.com/">Forgot Password?</a>
    </div>
    <div class="checkbox-container">
        <input type="checkbox" name="robot" id="robot" value="I'm not a robot"/>
        <label class="robot">I'm not a robot</label>
    </div>
    <button type="submit">SIGN IN</button>
    <p class="account">Don't have an account? <a href="https://www.djangoproject.com/">Sign up</a></p>
    <p class="p">Please use Google Chrome or</p>
    <p class="p">Mozilla Firefox for the best experience.</p>
</body>
</html>
